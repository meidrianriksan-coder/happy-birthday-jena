<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Section - BIRDS OF A FEATHER</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-main: #0a192f;
            --navy-card: #112240;
            --navy-dark: #020c1b;
            --accent-blue: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #020c1b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            position: relative;
            opacity: 0;
            transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.page-enter {
            opacity: 1;
        }

        body.page-exit {
            opacity: 0;
            transform: scale(0.98);
        }

        /* ANIMASI MASUK (STAGGERED) */
        .fade-element {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        body.page-enter .fade-element {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-vinyl {
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity;
        }

        body.page-enter .fade-vinyl {
            opacity: 1;
        }

        /* Delay Urutan Kemunculan */
        body.page-enter .delay-1 { transition-delay: 0.15s; }
        body.page-enter .delay-2 { transition-delay: 0.3s; }
        body.page-enter .delay-3 { transition-delay: 0.45s; }
        body.page-enter .delay-4 { transition-delay: 0.6s; }
        body.page-enter .delay-5 { transition-delay: 0.75s; }

        /* Tombol Kembali */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            backdrop-filter: blur(8px);
            transition: background 0.3s ease, color 0.3s ease, opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .back-btn:hover {
            background: #ffffff;
            color: var(--navy-dark);
        }

        /* Container Utama */
        .music-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* Judul Teks */
        .title-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            margin-bottom: 25px;
            text-align: center;
            z-index: 5;
            letter-spacing: 0.5px;
        }

        /* Piringan Hitam Besar */
        .giant-vinyl {
            position: absolute;
            left: -140px;
            top: 50%;
            transform: translateY(-50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: conic-gradient(
                from 30deg,
                #111111 0deg,
                #1a1a1a 40deg,
                #555555 75deg,
                #777777 90deg,
                #555555 105deg,
                #1a1a1a 140deg,
                #111111 180deg,
                #1a1a1a 220deg,
                #555555 255deg,
                #777777 270deg,
                #555555 285deg,
                #1a1a1a 320deg,
                #111111 360deg
            );
            box-shadow: 0 20px 45px rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            cursor: pointer;
            animation: spinVinyl 12s linear infinite;
        }

        .vinyl-inner-circle {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 70%, #0369a1 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .vinyl-inner-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #020c1b;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        @keyframes spinVinyl {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        /* Card Player MV YouTube */
        .mv-player-btn {
            position: relative;
            width: 560px;
            height: 315px;
            background: #000000;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            z-index: 4;
            display: block;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mv-player-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(56, 189, 248, 0.35);
        }

        .mv-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
            transition: background 0.3s ease;
        }

        .mv-player-btn:hover .player-overlay {
            background: rgba(0, 0, 0, 0.1);
        }

        .video-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .yt-logo-icon {
            width: 36px;
            height: 36px;
            background: #ff0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            color: #fff;
        }

        .video-title-text {
            font-size: 1rem;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .center-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 50px;
            background: #ff0000;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .mv-player-btn:hover .center-play-icon {
            transform: translate(-50%, -50%) scale(1.12);
            background: #cc0000;
        }

        .play-triangle {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 18px solid #ffffff;
            margin-left: 3px;
        }

        .yt-watermark {
            align-self: flex-end;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #ffffff;
            backdrop-filter: blur(4px);
        }

        /* Notasi Musik */
        .music-notes {
            position: absolute;
            right: 40px;
            bottom: 110px;
            font-size: 2.2rem;
            color: var(--accent-blue);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 3;
            animation: floatNotes 3s ease-in-out infinite alternate;
        }

        @keyframes floatNotes {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(-15px) rotate(10deg); opacity: 1; }
        }

        @media (max-width: 768px) {
            .giant-vinyl {
                width: 320px;
                height: 320px;
                left: -110px;
            }
            .mv-player-btn {
                width: 90vw;
                height: 230px;
            }
            .title-text {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- MEMANGGIL FILE BIRDS-OF-A-FEATHER.MP3 -->
    <audio id="bgSong" autoplay loop preload="auto">
        <source src="/birds-of-a-feather.mp3.mp3" type="audio/mpeg">
    </audio>

    <!-- TRIK PASIF UNTUK BROWSER -->
    <iframe src="birds-of-a-feather.mp3" allow="autoplay" style="display:none" id="iframeAudio"></iframe>

    <!-- 1. Tombol Kembali -->
    <a href="cake.html" class="back-btn fade-element delay-1" onclick="goBack(event)">← Kembali</a>

    <div class="music-container">
        <!-- 2. Judul Teks -->
        <h1 class="title-text fade-element delay-2">This song reminds me of you</h1>

        <!-- 3. Piringan Hitam Besar -->
        <div class="giant-vinyl fade-vinyl delay-3" id="vinylDisc">
            <div class="vinyl-inner-circle"></div>
        </div>

        <!-- 4. Player Card MV YouTube -->
        <a href="https://www.youtube.com/watch?v=V9PVRfjEBTI" target="_blank" class="mv-player-btn fade-element delay-4">
            <img src="https://img.youtube.com/vi/V9PVRfjEBTI/maxresdefault.jpg" alt="Billie Eilish - BIRDS OF A FEATHER" class="mv-poster">
            
            <div class="player-overlay">
                <div class="video-header-info">
                    <div class="yt-logo-icon">▶</div>
                    <span class="video-title-text">Billie Eilish - BIRDS OF A FEATHER (Official Music Video)</span>
                </div>

                <div class="center-play-icon">
                    <div class="play-triangle"></div>
                </div>

                <div class="yt-watermark">
                    Watch on YouTube
                </div>
            </div>
        </a>

        <!-- 5. Notasi Musik -->
        <div class="music-notes fade-element delay-5">
            <span>♫</span>
            <span style="margin-left: 15px;">♪</span>
            <span>♩</span>
        </div>
    </div>

    <script>
        const song = document.getElementById('bgSong');

        window.addEventListener('DOMContentLoaded', () => {
            // Animasi masuk
            requestAnimationFrame(() => {
                document.body.classList.add('page-enter');
            });

            // Jalankan pemutar lagu
            let playPromise = song.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    console.log("Lagu birds-of-a-feather.mp3 berhasil diputar!");
                }).catch(error => {
                    console.log("Autoplay ditahan browser. Menunggu interaksi pertama...");
                    // Jika ditahan browser, lagu diputar otomatis pada gerakan/sentuhan/klik pertama di layar
                    const enableAudio = () => {
                        song.play();
                        window.removeEventListener('click', enableAudio);
                        window.removeEventListener('touchstart', enableAudio);
                        window.removeEventListener('mousemove', enableAudio);
                    };

                    window.addEventListener('click', enableAudio);
                    window.addEventListener('touchstart', enableAudio);
                    window.addEventListener('mousemove', enableAudio);
                });
            }
        });

        // Transisi Halus saat Klik 'Kembali'
        function goBack(event) {
            event.preventDefault();
            
            let fadeAudio = setInterval(() => {
                if (song.volume > 0.1) {
                    song.volume -= 0.1;
                } else {
                    song.pause();
                    clearInterval(fadeAudio);
                }
            }, 50);

            document.body.classList.remove('page-enter');
            document.body.classList.add('page-exit');
            
            setTimeout(() => {
                window.location.href = 'cake.html';
            }, 500);
        }
    </script>
</body>
</html>
